name: PBL4 regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
        ports:
          - 33307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, mbstring
          coverage: none
      - name: Test dependencies (no camera or model downloads)
        run: python -m pip install numpy==1.26.4 Pillow==11.3.0 Flask==3.1.2 requests==2.32.5 PyMySQL==1.1.2 scikit-learn==1.7.2 scipy==1.16.2 joblib==1.5.2
      - name: PHP syntax
        run: find DoAn_ChamCong_AI -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Core regressions
        run: python -B -m unittest discover -s pbl4-face-ai/tests -v
      - name: Flask, receiver and training regressions
        run: |
          python -B tools/test_ai_enrollment.py -v
          python -B tools/test_upload_receiver.py -v
          python -B tools/test_status_training_runtime.py -v
      - name: Isolated DB, HTTP and desktop regressions
        env:
          PBL4_TEST_DATABASE: isolated
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: '33307'
          MARIADB_USER: root
          MARIADB_PASSWORD: ci-only-password
          MARIADB_DATABASE: DoAn_ChamCong_AI_MariaDB
        run: python -B tools/test_ci_database.py
