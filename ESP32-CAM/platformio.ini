; PlatformIO Project Configuration File for PBL4-FaceHealth-IoT ESP32-CAM
; 
; Node 1: ESP32-CAM Chụp ảnh định kỳ (3s) gửi về Flask Server qua WiFi gia đình

[platformio]
default_envs = esp32cam_node1

[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder, default
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2

; -------------------------------------------------------------
; MẠCH 1: ESP32-CAM CHỤP ẢNH GỬI SERVER (NODE 1)
; -------------------------------------------------------------
[env:esp32cam_node1]
build_flags = 
    ${env.build_flags}
    -DCAM_NODE_1
lib_deps = 
